services:
  - type: web
    name: campuspulse-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: campuspulse
      - key: CORS_ORIGINS
        sync: false
